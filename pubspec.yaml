name: mai_navigator
description: Навигатор по 3 корпусу МАИ, 1 этаж
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  qr_code_scanner_plus: ^2.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_1024.png"
  adaptive_icon_background: "#0E1628"
  adaptive_icon_foreground: "assets/icon/icon_foreground_1024.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/menu/